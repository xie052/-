name: 桂林奥迪店每日天气推送

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 获取天气并发送
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          QW_HOST: "nw5pwfuc2u.re.qweatherapi.com"
        shell: bash
        run: |
          set +e
          DATE_STR=$(TZ=Asia/Shanghai date '+%Y年%m月%d日 %H:%M')

          # 1. 实时天气（已验证成功）
          WEATHER=$(curl -s --compressed "https://${QW_HOST}/v7/weather/now?location=101300501&key=${QWEATHER_KEY}")
          echo "天气原始返回: $WEATHER"
          CODE=$(echo "$WEATHER" | jq -r '.code // "null"')

          if [ "$CODE" = "200" ]; then
            TEXT=$(echo "$WEATHER" | jq -r '.now.text')
            TEMP=$(echo "$WEATHER" | jq -r '.now.temp')
            WINDDIR=$(echo "$WEATHER" | jq -r '.now.windDir')
            WINDSCALE=$(echo "$WEATHER" | jq -r '.now.windScale')
          else
            TEXT="天气接口异常(code=$CODE)"
            TEMP="--"; WINDDIR="--"; WINDSCALE="--"
          fi

          # 2. 灾害预警（修正为 v7/warning/now，配合专属 Host）
          WARN=$(curl -s --compressed "https://${QW_HOST}/v7/warning/now?location=101300501&key=${QWEATHER_KEY}")
          echo "预警原始返回: $WARN"
          WCODE=$(echo "$WARN" | jq -r '.code // "null"')

          if [ "$WCODE" = "200" ]; then
            WTITLE=$(echo "$WARN" | jq -r '.warningList[0].title // empty')
            if [ -z "$WTITLE" ]; then WARNING_LINE="无"; else WARNING_LINE="$WTITLE"; fi
          elif [ "$WCODE" = "204" ]; then
            WARNING_LINE="无"
          else
            WARNING_LINE="预警接口异常(code=$WCODE)"
          fi

          # 3. 拼接消息（jq 处理换行）
          MSG=$(jq -n \
            --arg date "$DATE_STR" \
            --arg text "$TEXT" \
            --arg temp "$TEMP" \
            --arg winddir "$WINDDIR" \
            --arg windscl "$WINDSCALE" \
            --arg warn "$WARNING_LINE" \
            '"【每日天气通报】\n桂林奥迪店 - " + $date + "\n今日：" + $text + "，" + $temp + "℃，风" + $winddir + $windscl + "级\n灾害预警：" + $warn + "\n\n商品车/展车无淋雨风险，洗车、客户接待、外拓正常。\n员工早晚备薄外套，午间按温度调整展厅制冷。"')

          echo -e "准备发送:\n$(echo "$MSG" | jq -r '.')"

          PAYLOAD=$(jq -n --arg c "$MSG" '{msgtype:"text",text:{content:$c}}')
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
            -H "Content-Type: application/json" -d "$PAYLOAD"

          echo "完成"
