name: 桂林奥迪店每日天气推送

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 获取天气并发送
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          QW_HOST: "nw5pwfuc2u.re.qweatherapi.com"
        shell: bash
        run: |
          set +e
          # 日期格式：2026年10月13日 星期二
          WEEKDAY=$(TZ=Asia/Shanghai date '+%w')
          case $WEEKDAY in
            0) CN_WEEK="星期日";;
            1) CN_WEEK="星期一";;
            2) CN_WEEK="星期二";;
            3) CN_WEEK="星期三";;
            4) CN_WEEK="星期四";;
            5) CN_WEEK="星期五";;
            6) CN_WEEK="星期六";;
          esac
          DATE_STR=$(TZ=Asia/Shanghai date "+%Y年%m月%d日 ${CN_WEEK}")

          # 1. 实时天气
          WEATHER=$(curl -s --compressed "https://${QW_HOST}/v7/weather/now?location=101300501&key=${QWEATHER_KEY}")
          CODE=$(echo "$WEATHER" | jq -r '.code // "null"')
          if [ "$CODE" = "200" ]; then
            TEXT=$(echo "$WEATHER" | jq -r '.now.text')
            TEMP=$(echo "$WEATHER" | jq -r '.now.temp')
            WINDDIR=$(echo "$WEATHER" | jq -r '.now.windDir')
            WINDSCALE=$(echo "$WEATHER" | jq -r '.now.windScale')
          else
            TEXT="天气接口异常(code=$CODE)"; TEMP="--"; WINDDIR="--"; WINDSCALE="--"
          fi

          # 2. 灾害预警
          WARN=$(curl -s --compressed "https://${QW_HOST}/weatheralert/v1/current/25.27/110.29?key=${QWEATHER_KEY}")
          echo "预警原始返回: $WARN"
          ZERORESULT=$(echo "$WARN" | jq -r '.metadata.zeroResult // false')
          WTITLE=$(echo "$WARN" | jq -r '.alerts[0].headline // empty')
          
          if [ "$ZERORESULT" = "true" ] || [ -z "$WTITLE" ]; then
            WARNING_LINE="无"
          else
            WARNING_LINE="${WTITLE:-预警接口异常}"
          fi

          # 3. 拼接消息
          MSG=$(printf "【每日天气通报】\n桂林奥迪店 - %s\n今日天气：%s，气温%s℃，%s%s级\n灾害预警：%s" \
            "$DATE_STR" "$TEXT" "$TEMP" "$WINDDIR" "$WINDSCALE" "$WARNING_LINE")
          
          echo -e "准备发送:\n$MSG"
          PAYLOAD=$(jq -n --arg c "$MSG" '{msgtype:"text",text:{content:$c}}')
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
          echo "完成"
