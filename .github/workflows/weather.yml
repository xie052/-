name: 桂林奥迪店每日天气推送

# 注意：GitHub schedule 使用 UTC 时区。
# 当前为测试用每 5 分钟触发，测试完成后可改为生产 cron（示例：每天北京时间 07:00 -> UTC 23:00: '0 23 * * *'）
on:
  schedule:
    #- cron: '*/5 * * * *'   # 测试用：每 5 分钟一次（UTC）
     - cron: '0 6 * * *'    # UTC 06:00 = 北京时间 14:00
     - cron: '0 23 * * *'    # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-notify
  cancel-in-progress: true

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show trigger type
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get weather and send (safe, verbose)
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          QW_HOST: "nw5pwfuc2u.re.qweatherapi.com"
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'

          # Debug: check secrets presence (do NOT print secret values)
          echo "QWEATHER_KEY set: ${QWEATHER_KEY:+yes}"
          echo "WECOM_KEY set: ${WECOM_KEY:+yes}"

          # 计算日期（北京时间）
          WEEKDAY=$(TZ=Asia/Shanghai date '+%w')
          case $WEEKDAY in
            0) CN_WEEK="星期日";;
            1) CN_WEEK="星期一";;
            2) CN_WEEK="星期二";;
            3) CN_WEEK="星期三";;
            4) CN_WEEK="星期四";;
            5) CN_WEEK="星期五";;
            6) CN_WEEK="星期六";;
          esac
          DATE_STR=$(TZ=Asia/Shanghai date "+%Y年%m月%d日 ${CN_WEEK}")

          # 请求实时天气，打印 HTTP code 和 body，便于排查 scheduler-run 时的问题
          WEATHER_RESP=$(curl -sS -w "\n%{http_code}" --compressed "https://${QW_HOST}/v7/weather/now?location=101300501&key=${QWEATHER_KEY}")
          HTTP_CODE=$(echo "$WEATHER_RESP" | tail -n1)
          WEATHER_BODY=$(echo "$WEATHER_RESP" | sed '$d')
          echo "天气接口 HTTP code: $HTTP_CODE"
          echo "天气接口 body: $WEATHER_BODY"

          CODE=$(echo "$WEATHER_BODY" | jq -r '.code // "null"' 2>/dev/null || echo "null")
          if [ "$CODE" != "200" ]; then
            echo "警告：天气接口返回非 200 (code=$CODE)。将继续并使用可用字段或占位符发送消息。"
          fi

          TEXT=$(echo "$WEATHER_BODY" | jq -r '.now.text // "N/A"' 2>/dev/null || echo "N/A")
          TEMP=$(echo "$WEATHER_BODY" | jq -r '.now.temp // "N/A"' 2>/dev/null || echo "N/A")
          WINDDIR=$(echo "$WEATHER_BODY" | jq -r '.now.windDir // "N/A"' 2>/dev/null || echo "N/A")
          WINDSCALE=$(echo "$WEATHER_BODY" | jq -r '.now.windScale // "N/A"' 2>/dev/null || echo "N/A")

          # 新增：逐日预报（取今天最低/最高）
          FORECAST_RESP=$(curl -sS --compressed "https://${QW_HOST}/v7/weather/3d?location=101300501&key=${QWEATHER_KEY}")
          echo "预报接口 body: $FORECAST_RESP"

          FCODE=$(echo "$FORECAST_RESP" | jq -r '.code // "null"')
          if [ "$FCODE" = "200" ]; then
            TEMP_MIN=$(echo "$FORECAST_RESP" | jq -r '.daily[0].tempMin // "N/A"')
            TEMP_MAX=$(echo "$FORECAST_RESP" | jq -r '.daily[0].tempMax // "N/A"')
          else
            TEMP_MIN="N/A"
            TEMP_MAX="N/A"
          fi

          # 拼成 22～32℃
          if [ "$TEMP_MIN" != "N/A" ] && [ "$TEMP_MAX" != "N/A" ]; then
            TEMP_RANGE="${TEMP_MIN}～${TEMP_MAX}℃"
          else
            TEMP_RANGE="${TEMP}℃"
          fi

          # 请求预警（也打印返回）
          WARN_RESP=$(curl -sS -w "\n%{http_code}" --compressed "https://${QW_HOST}/weatheralert/v1/current/25.27/110.29?key=${QWEATHER_KEY}")
          WARN_BODY=$(echo "$WARN_RESP" | sed '$d' || echo "")
          echo "预警接口 body: $WARN_BODY"

          ZERORESULT=$(echo "$WARN_BODY" | jq -r '.metadata.zeroResult // false' 2>/dev/null || echo "false")
          WTITLE=$(echo "$WARN_BODY" | jq -r '.alerts[0].headline // ""' 2>/dev/null || echo "")

          if [ "$ZERORESULT" = "true" ] || [ -z "$WTITLE" ]; then
            WARNING_LINE="无"
          else
            WARNING_LINE="${WTITLE:-预警接口异常}"
          fi

          MSG=$(printf "【每日天气通报】\n桂林奥迪店 - %s\n今日天气：%s，%s，%s%s级\n灾害预警：%s" \
          "$DATE_STR" "$TEXT" "$TEMP_RANGE" "$WINDDIR" "$WINDSCALE" "$WARNING_LINE")

          echo -e "准备发送消息如下：\n$MSG"

          PAYLOAD=$(jq -n --arg c "$MSG" '{msgtype:"text",text:{content:$c}}')

          # 发送到企业微信 webhook，打印返回值
          WECOM_RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
            -H "Content-Type: application/json" -d "$PAYLOAD" || true)
          echo "企业微信返回：$WECOM_RESP"

      - name: Finished
        run: echo "Done"
