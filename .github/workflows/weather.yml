name: 桂林奥迪店每日天气推送

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: 发送天气到企业微信
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
        run: |
          # 1. 获取实时天气
          WEATHER=$(curl -s "https://devapi.qweather.com/v7/weather/now?location=101300501&key=${QWEATHER_KEY}")
          TEXT=$(echo "$WEATHER" | jq -r '.now.text')
          TEMP=$(echo "$WEATHER" | jq -r '.now.temp')
          WINDDIR=$(echo "$WEATHER" | jq -r '.now.windDir')
          WINDSCALE=$(echo "$WEATHER" | jq -r '.now.windScale')

          # 2. 获取预警
          WARNING=$(curl -s "https://devapi.qweather.com/v7/warning/now?location=101300501&key=${QWEATHER_KEY}")
          WARNING_TITLE=$(echo "$WARNING" | jq -r '.warningList[0].title // empty')

          if [ -z "$WARNING_TITLE" ]; then
            WARNING_LINE='<font color="info">无</font>'
          else
            WARNING_LINE="<font color=\"warning\">${WARNING_TITLE}</font>"
          fi

          # 3. 组装消息
          DATE_STR=$(TZ=Asia/Shanghai date '+%Y年%m月%d日 %H:%M')
          
          MSG="# 🌤 每日天气通报
**桂林奥迪店 - ${DATE_STR}**

> 今日：${TEXT}，${TEMP}℃，${WINDDIR}${WINDSCALE}级
> 灾害预警：${WARNING_LINE}

**现场提示**
- 商品车/展车无淋雨风险，洗车、客户接待、外拓正常开展。
- 员工早晚备薄外套，午间按温度调整展厅制冷。"

          # 4. 发送到企业微信
          PAYLOAD=$(jq -n --arg c "$MSG" '{msgtype:"markdown",markdown:{content:$c}}')
          
          curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
